name: opportunity-radar

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opportunity_radar:change-me-for-local-use@postgres:5432/opportunity_radar}
  # Cloud AI on Groq is opt-in (SPEC 43, section 5); a real key only ever comes from the
  # untracked .env file, never from this default.
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-groq}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_REASONING_MODEL: ${GROQ_REASONING_MODEL:-openai/gpt-oss-120b}
  GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-openai/gpt-oss-20b}
  GROQ_ALT_MODEL: ${GROQ_ALT_MODEL:-qwen/qwen3.8-27b}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-25}
  AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
  AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
  AI_ANALYSIS_PROMPT: ${AI_ANALYSIS_PROMPT:-v1}
  AI_DAILY_REQUESTS_SOFT_LIMIT: ${AI_DAILY_REQUESTS_SOFT_LIMIT:-850}
  AI_DAILY_TOKENS_SOFT_LIMIT: ${AI_DAILY_TOKENS_SOFT_LIMIT:-170000}
  AI_MINUTE_TOKENS_SOFT_LIMIT: ${AI_MINUTE_TOKENS_SOFT_LIMIT:-7000}
  AI_MINUTE_REQUESTS_SOFT_LIMIT: ${AI_MINUTE_REQUESTS_SOFT_LIMIT:-25}
  AI_BREAKER_FAILURES: ${AI_BREAKER_FAILURES:-5}
  AI_BREAKER_COOLDOWN_SECONDS: ${AI_BREAKER_COOLDOWN_SECONDS:-120}
  # Tavily search/extract (docs/41-spec-tavily.md); absent key keeps the source blocked
  # by configuration, the same treatment SOURCE_ALERT_WEBHOOK_URL gets below.
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
  TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
  TAVILY_EXTRACT_DEPTH: ${TAVILY_EXTRACT_DEPTH:-basic}
  TAVILY_EXTRACT_FORMAT: ${TAVILY_EXTRACT_FORMAT:-markdown}
  TAVILY_CREDIT_BUDGET_PER_RUN: ${TAVILY_CREDIT_BUDGET_PER_RUN:-100}
  TAVILY_EXTRACT_CACHE_TTL_SECONDS: ${TAVILY_EXTRACT_CACHE_TTL_SECONDS:-2592000}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  COLLECTION_TIMEZONE: ${COLLECTION_TIMEZONE:-America/Sao_Paulo}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
  # The kill switches are only operable if they reach the worker container: the service
  # inherits this block alone, so a value left out here cannot be set without editing code.
  WORKER_COLLECT_ENABLED: ${WORKER_COLLECT_ENABLED:-true}
  WORKER_NORMALIZE_ENABLED: ${WORKER_NORMALIZE_ENABLED:-true}
  WORKER_MATCH_ENABLED: ${WORKER_MATCH_ENABLED:-true}
  WORKER_ANALYZE_ENABLED: ${WORKER_ANALYZE_ENABLED:-true}
  WORKER_RETENTION_ENABLED: ${WORKER_RETENTION_ENABLED:-true}
  WORKER_EVALUATE_BATCH_SIZE: ${WORKER_EVALUATE_BATCH_SIZE:-50}
  WORKER_ANALYZE_BATCH_SIZE: ${WORKER_ANALYZE_BATCH_SIZE:-10}
  WORKER_ANALYZE_VERDICTS: ${WORKER_ANALYZE_VERDICTS:-HIGH_PRIORITY,RECOMMENDED,WATCHLIST,REVIEW_REQUIRED}
  ANALYSIS_RETRY_COOLDOWN_SECONDS: ${ANALYSIS_RETRY_COOLDOWN_SECONDS:-3600}
  ANALYSIS_RETRY_ATTEMPT_WINDOW_SECONDS: ${ANALYSIS_RETRY_ATTEMPT_WINDOW_SECONDS:-86400}
  ANALYSIS_RETRY_MAX_ATTEMPTS: ${ANALYSIS_RETRY_MAX_ATTEMPTS:-3}
  ANALYSIS_CLAIM_LEASE_SECONDS: ${ANALYSIS_CLAIM_LEASE_SECONDS:-900}
  COLLECTION_BACKOFF_BASE_SECONDS: ${COLLECTION_BACKOFF_BASE_SECONDS:-300}
  COLLECTION_BACKOFF_CEILING_SECONDS: ${COLLECTION_BACKOFF_CEILING_SECONDS:-86400}
  GREENHOUSE_BASE_URL: ${GREENHOUSE_BASE_URL:-https://boards-api.greenhouse.io}
  SOURCE_ALERT_WEBHOOK_URL: ${SOURCE_ALERT_WEBHOOK_URL:-}
  SOURCE_ALERT_FAILURE_THRESHOLD: ${SOURCE_ALERT_FAILURE_THRESHOLD:-3}
  SOURCE_ALERT_TIMEOUT_SECONDS: ${SOURCE_ALERT_TIMEOUT_SECONDS:-5}
  PAYLOAD_RETENTION_DAYS: ${PAYLOAD_RETENTION_DAYS:-365}
  PAYLOAD_RETENTION_BATCH_SIZE: ${PAYLOAD_RETENTION_BATCH_SIZE:-500}
  PAYLOAD_RETENTION_INTERVAL_SECONDS: ${PAYLOAD_RETENTION_INTERVAL_SECONDS:-21600}
  DOCTOR_JOB_GRACE_SECONDS: ${DOCTOR_JOB_GRACE_SECONDS:-120}

services:
  postgres:
    # The same alpine base as before, with pgvector compiled on top (card F16-09). The
    # official pgvector image is Debian: switching the base under an existing volume
    # changes the text collation beneath built indexes and corrupts them silently.
    build:
      context: docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_radar}
      POSTGRES_USER: ${POSTGRES_USER:-opportunity_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [app_net]

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app_net]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: test
    environment: *app-environment
    command: ["uvicorn", "opportunity_radar.presentation.http.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [app_net]

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment: *app-environment
    command: ["python", "-m", "opportunity_radar.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_exports:/app/data/exports
      - local_backups:/app/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/tmp/opportunity-radar-worker-ready').is_file() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [app_net]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [app_net]

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  local_exports:
  local_backups:
