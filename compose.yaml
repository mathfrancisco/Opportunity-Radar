name: opportunity-radar

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opportunity_radar:change-me-for-local-use@postgres:5432/opportunity_radar}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL_ANALYSIS: ${OLLAMA_MODEL_ANALYSIS:-qwen3:8b-q4_K_M}
  OLLAMA_ANALYSIS_ENABLED: ${OLLAMA_ANALYSIS_ENABLED:-true}
  OLLAMA_ANALYSIS_TIMEOUT_SECONDS: ${OLLAMA_ANALYSIS_TIMEOUT_SECONDS:-60}
  OLLAMA_ANALYSIS_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_ANALYSIS_CONNECT_TIMEOUT_SECONDS:-5}
  OLLAMA_ANALYSIS_MAX_RETRIES: ${OLLAMA_ANALYSIS_MAX_RETRIES:-1}
  OLLAMA_ANALYSIS_RETRY_AFTER_SECONDS: ${OLLAMA_ANALYSIS_RETRY_AFTER_SECONDS:-0.5}
  OLLAMA_ANALYSIS_CACHE_ENTRIES: ${OLLAMA_ANALYSIS_CACHE_ENTRIES:-256}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
  OLLAMA_SEED: ${OLLAMA_SEED:-42}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
  OLLAMA_THINK: ${OLLAMA_THINK:-false}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  COLLECTION_TIMEZONE: ${COLLECTION_TIMEZONE:-America/Sao_Paulo}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
  # The kill switches are only operable if they reach the worker container: the service
  # inherits this block alone, so a value left out here cannot be set without editing code.
  WORKER_COLLECT_ENABLED: ${WORKER_COLLECT_ENABLED:-true}
  WORKER_NORMALIZE_ENABLED: ${WORKER_NORMALIZE_ENABLED:-true}
  WORKER_MATCH_ENABLED: ${WORKER_MATCH_ENABLED:-true}
  WORKER_ANALYZE_ENABLED: ${WORKER_ANALYZE_ENABLED:-true}
  WORKER_RETENTION_ENABLED: ${WORKER_RETENTION_ENABLED:-true}
  WORKER_EVALUATE_BATCH_SIZE: ${WORKER_EVALUATE_BATCH_SIZE:-50}
  WORKER_ANALYZE_BATCH_SIZE: ${WORKER_ANALYZE_BATCH_SIZE:-10}
  WORKER_ANALYZE_VERDICTS: ${WORKER_ANALYZE_VERDICTS:-HIGH_PRIORITY,RECOMMENDED,WATCHLIST,REVIEW_REQUIRED}
  ANALYSIS_RETRY_COOLDOWN_SECONDS: ${ANALYSIS_RETRY_COOLDOWN_SECONDS:-3600}
  ANALYSIS_RETRY_ATTEMPT_WINDOW_SECONDS: ${ANALYSIS_RETRY_ATTEMPT_WINDOW_SECONDS:-86400}
  ANALYSIS_RETRY_MAX_ATTEMPTS: ${ANALYSIS_RETRY_MAX_ATTEMPTS:-3}
  ANALYSIS_CLAIM_LEASE_SECONDS: ${ANALYSIS_CLAIM_LEASE_SECONDS:-900}
  COLLECTION_BACKOFF_BASE_SECONDS: ${COLLECTION_BACKOFF_BASE_SECONDS:-300}
  COLLECTION_BACKOFF_CEILING_SECONDS: ${COLLECTION_BACKOFF_CEILING_SECONDS:-86400}
  GREENHOUSE_BASE_URL: ${GREENHOUSE_BASE_URL:-https://boards-api.greenhouse.io}
  SOURCE_ALERT_WEBHOOK_URL: ${SOURCE_ALERT_WEBHOOK_URL:-}
  SOURCE_ALERT_FAILURE_THRESHOLD: ${SOURCE_ALERT_FAILURE_THRESHOLD:-3}
  SOURCE_ALERT_TIMEOUT_SECONDS: ${SOURCE_ALERT_TIMEOUT_SECONDS:-5}
  PAYLOAD_RETENTION_DAYS: ${PAYLOAD_RETENTION_DAYS:-365}
  PAYLOAD_RETENTION_BATCH_SIZE: ${PAYLOAD_RETENTION_BATCH_SIZE:-500}
  PAYLOAD_RETENTION_INTERVAL_SECONDS: ${PAYLOAD_RETENTION_INTERVAL_SECONDS:-21600}
  DOCTOR_JOB_GRACE_SECONDS: ${DOCTOR_JOB_GRACE_SECONDS:-120}

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_radar}
      POSTGRES_USER: ${POSTGRES_USER:-opportunity_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [app_net]

  ollama:
    # Pinned by digest: a tag can be republished, and a server version changes the
    # tokenizer, the defaults and the speed under the same name. 0.34.4 carries the CUDA
    # runners the RTX 5060 (Blackwell) needs; 0.5.13 predates them.
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    environment:
      # Flash attention and a q8 KV cache shrink the context's memory, which is what lets
      # an 8B model and an 8k window share the 8 GB of VRAM (docs/36-spec-ollama.md 3.1).
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Each parallel request reserves another context cache; 8 GB holds one.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    # If a model spills out of VRAM, the Ollama container runs out of memory, not Postgres.
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [app_net]

  # Pulls the configured models once and exits, so a fresh machine does not need a
  # terminal to get the semantic layer working. Nothing depends on it: analysis is
  # optional, and a model still downloading reads as MODEL_UNAVAILABLE, classified.
  ollama-init:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$OLLAMA_MODEL_ANALYSIS"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_ANALYSIS: ${OLLAMA_MODEL_ANALYSIS:-qwen3:8b-q4_K_M}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [app_net]

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app_net]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: test
    environment: *app-environment
    command: ["uvicorn", "opportunity_radar.presentation.http.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [app_net]

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment: *app-environment
    command: ["python", "-m", "opportunity_radar.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    volumes:
      - local_exports:/app/data/exports
      - local_backups:/app/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/tmp/opportunity-radar-worker-ready').is_file() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [app_net]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [app_net]

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
  local_exports:
  local_backups:
