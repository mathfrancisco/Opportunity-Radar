prompt_version: opportunity_analysis/v2
schema_version: analysis-v2
created_at: "2026-09-27"
default_model: openai/gpt-oss-120b
temperature: 0
response_format: json_schema
# Card F16-07 / F20-18: the profile block carries recent experiences and projects, and
# the adapter's `requires` (matching/groq.py) reads this flag to load `profile_history`.
profile_history: true
summary: >-
  Advisory semantic analysis of one opportunity against one profile, reading the job
  posting and the profile's recent history, answering in pt-BR with each strength and
  risk backed by a literal excerpt of the payload it was sent. Carries no score, no
  eligibility and no disqualifier, so it can never override the deterministic result.
variables:
  - deterministic_result
  - opportunity
  - posting
  - profile
  - profile_history
  - schema_version
artifacts:
  - system.md
  - user.md.j2
  - output.schema.json
  - examples.json
notes: >-
  output.schema.json is generated from matching.analysis.OUTPUT_SCHEMAS["analysis-v2"] by
  scripts/export_prompt_schema.py. Edit the Python constant, never this file: the loader
  refuses to start when the two drift apart. v1 stays the historical baseline (card
  F20-21) and is never edited by this card.
