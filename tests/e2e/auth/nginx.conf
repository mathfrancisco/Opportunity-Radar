# TLS front for the Compose CI stack (test-only). It plays two roles on one certificate:
#   * issuer.test (inside app_net): serves the public JWKS the production API fetches over
#     HTTPS, so the API verifies tokens offline with no real identity provider;
#   * 127.0.0.1:8443 (published on loopback only): the HTTPS origin tests use, proxying
#     everything else (the SPA and its /api/ proxy) to the frontend service.
# Access logs are off so bearer-carrying requests are never written anywhere.
resolver 127.0.0.11 valid=10s ipv6=off;
access_log off;

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /auth/tls/server.pem;
    ssl_certificate_key /auth/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    location = /.well-known/jwks.json {
        alias /auth/public/jwks.json;
        default_type application/json;
    }

    location / {
        set $upstream_frontend frontend:8080;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
