name: opportunity-radar-cloud

# This is deliberately not an override for compose.yaml. It is the cloud topology:
# the managed PostgreSQL database and the static frontend are external services.
x-runtime-environment: &runtime-environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must reference the managed PostgreSQL database}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be the exact HTTPS Pages origin}
  CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required by the production API}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL is required by the production API}
  CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required by the production API}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-} # optional JWT audience restriction
  CLERK_OWNER_SUB: ${CLERK_OWNER_SUB:?CLERK_OWNER_SUB is required by the production API}
  AI_ENABLED: ${AI_ENABLED:-false}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  TOKENHARBOR_API_KEY: ${TOKENHARBOR_API_KEY:-}
  TOKENHARBOR_BASE_URL: ${TOKENHARBOR_BASE_URL:-https://tokenharbor.ai/v1}
  TOKENHARBOR_MODELS: ${TOKENHARBOR_MODELS:-deepseek-v4.1-flash:free,mimo-v2.6-flash:free}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
  CEREBRAS_MODELS: ${CEREBRAS_MODELS:-gpt-oss-120b,qwen-3.8-27b}
  ZEN_API_KEY: ${ZEN_API_KEY:-}
  ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/inference/openai/v1}
  ZEN_MODELS: ${ZEN_MODELS:-deepseek-v4.1-flash-free,glm-5.3-flash-free,minimax-m3.1-flash-free}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
  GEMINI_MODELS: ${GEMINI_MODELS:-gemma-4-31b-it}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODELS: ${OPENROUTER_MODELS:-openai/gpt-oss-120b:free}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
  MISTRAL_MODELS: ${MISTRAL_MODELS:-mistral-small-latest}
  NIM_API_KEY: ${NIM_API_KEY:-}
  NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NIM_MODELS: ${NIM_MODELS:-openai/gpt-oss-120b}
  WORKERSAI_API_KEY: ${WORKERSAI_API_KEY:-}
  WORKERSAI_BASE_URL: ${WORKERSAI_BASE_URL:-https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1}
  WORKERSAI_MODELS: ${WORKERSAI_MODELS:-@cf/openai/gpt-oss-120b}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  AI_RESERVE_ORDER: ${AI_RESERVE_ORDER:-cerebras,zen,nim,tokenharbor,gemini,mistral,openrouter,workersai}
  AI_PROVIDER_LIMITS: ${AI_PROVIDER_LIMITS:-{}}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE must be an approved immutable image@sha256:<64 hex> digest}
    environment:
      <<: *runtime-environment
      # Only the one-time 0069 migration reads this value. Do not retain it in the
      # systemd runtime environment after that migration succeeds.
      OWNER_SUB_BACKFILL: ${OWNER_SUB_BACKFILL:-}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [runtime]

  api:
    image: ${API_IMAGE:?API_IMAGE must be an approved immutable image@sha256:<64 hex> digest}
    environment: *runtime-environment
    command: ["uvicorn", "opportunity_radar.presentation.http.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [runtime]

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an approved immutable image@sha256:<64 hex> digest}
    environment:
      <<: *runtime-environment
      WORKER_OWNER_SUB: ${WORKER_OWNER_SUB:?WORKER_OWNER_SUB is required for a finite personal pipeline}
      # R55-E2/E6 retention. Deleting stays off until OPPORTUNITY_RETENTION_APPLY=true;
      # DAYS=0 turns off deletions only, the daily size watch keeps running.
      OPPORTUNITY_RETENTION_DAYS: ${OPPORTUNITY_RETENTION_DAYS:-7}
      OPPORTUNITY_RETENTION_BATCH_SIZE: ${OPPORTUNITY_RETENTION_BATCH_SIZE:-500}
      OPPORTUNITY_OFF_TARGET_RETENTION_DAYS: ${OPPORTUNITY_OFF_TARGET_RETENTION_DAYS:-0}
      COLLECTION_PREFILTER_ENABLED: ${COLLECTION_PREFILTER_ENABLED:-false}
      OPPORTUNITY_RETENTION_APPLY: ${OPPORTUNITY_RETENTION_APPLY:-false}
      AI_CALL_RECORD_RETENTION_DAYS: ${AI_CALL_RECORD_RETENTION_DAYS:-7}
      PAYLOAD_RETENTION_DAYS: ${PAYLOAD_RETENTION_DAYS:-2}
      PAYLOAD_RETENTION_BATCH_SIZE: ${PAYLOAD_RETENTION_BATCH_SIZE:-500}
      ASSESSMENT_RETENTION_DAYS: ${ASSESSMENT_RETENTION_DAYS:-1}
      ASSESSMENT_RETENTION_BATCH_SIZE: ${ASSESSMENT_RETENTION_BATCH_SIZE:-500}
      RETENTION_STAGE_BUDGET_SECONDS: ${RETENTION_STAGE_BUDGET_SECONDS:-300}
      DATABASE_SIZE_LIMIT_BYTES: ${DATABASE_SIZE_LIMIT_BYTES:-1000000000}
      DATABASE_SIZE_ALERT_RATIO: ${DATABASE_SIZE_ALERT_RATIO:-0.7}
    command: ["python", "scripts/run_pipeline_once.py", "--deadline-seconds", "${PIPELINE_DEADLINE_SECONDS:?PIPELINE_DEADLINE_SECONDS is required}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [runtime]

  proxy:
    image: ${PROXY_IMAGE:?PROXY_IMAGE must be an approved immutable image@sha256:<64 hex> digest}
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be the exact public API hostname}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./docker/proxy/nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ${TLS_FULLCHAIN_PATH:?TLS_FULLCHAIN_PATH must name a readable fullchain PEM file}
        target: /run/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${TLS_PRIVATE_KEY_PATH:?TLS_PRIVATE_KEY_PATH must name a readable private-key PEM file}
        target: /run/tls/privkey.pem
        read_only: true
    restart: unless-stopped
    networks: [runtime]

networks:
  runtime:
    driver: bridge
