resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Variable-based proxy_pass forces nginx to re-resolve the upstream
        # via the Docker embedded DNS on every `valid` window instead of
        # caching the IP for the worker's lifetime. Without this, recreating
        # the `api` container (new IP) leaves the frontend returning 502
        # until nginx itself is restarted.
        set $upstream_api api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
