name: CI/CD

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish container images after validation
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend / lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Verify the prompt schema artifact matches OUTPUT_SCHEMA
        run: python scripts/export_prompt_schema.py --check

  backend-tests:
    name: Backend / tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://opportunity_radar:ci-password@127.0.0.1:5432/opportunity_radar
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      RUN_DATABASE_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: opportunity_radar
          POSTGRES_USER: opportunity_radar
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity_radar -d opportunity_radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Verify migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "$(alembic heads | awk '{print $1}')"
      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend / lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate frontend
        run: npm run check

  e2e:
    name: Compose / smoke E2E and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, backend-tests, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - name: Start application
        run: docker compose -f compose.yaml -f compose.ci.yaml up --detach --build api worker frontend
      - name: Verify API, frontend and degraded AI mode
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/
          curl --fail http://127.0.0.1:8000/health | python -c "import json,sys; data=json.load(sys.stdin); assert data['ollama']['status'] == 'degraded'"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f compose.yaml -f compose.ci.yaml ps -q worker)")" = "healthy"
      - name: Import and expose the researched company catalog
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml run --rm \
            -v "$PWD/docs/pesquisas:/imports:ro" \
            api python scripts/import_research_catalog.py \
            --input /imports/auditoria-186-empresas.md \
            --input /imports/empresas-adicionais.md
          curl --fail http://127.0.0.1:3000/api/companies | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 220"
          curl --fail http://127.0.0.1:3000/api/sources | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 7; assert {item['source_type'] for item in data['items']} == {'ashby', 'lever', 'greenhouse', 'remotive'}; assert all(not item['enabled'] for item in data['items']); greenhouse=next(item for item in data['items'] if item['source_type'] == 'greenhouse'); assert greenhouse['evidence_status'] == 'ats_identified'; assert greenhouse['configuration']['board_token'] == 'assemblyai'; remotive=next(item for item in data['items'] if item['source_type'] == 'remotive'); assert remotive['evidence_status'] == 'unverified'; assert remotive['rate_limit_policy']['minimum_run_interval_seconds'] == 21600"
      - name: Verify manual acquisition through the public API
        run: |
          source_id="$(curl --fail --silent \
            --json '{"source_type":"manual","name":"CI manual intake","enabled":true,"evidence_status":"confirmed","collector_local_tested":true}' \
            http://127.0.0.1:3000/api/sources | \
            python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          run_payload='{"correlation_id":"compose-e2e","inputs":[{"kind":"URL","value":"https://example.com/jobs/ci-1","metadata":{"title":"Senior Python Engineer","company_name":"Example","location_text":"Remote","employment_type":"full-time","salaryRange":{"min":100000,"max":150000,"currency":"USD","interval":"year"},"skills":["Python","ReactJS"]}},{"kind":"TEXT","value":"Required: Python and ReactJS.","metadata":{"title":"Senior Python Engineer","company_name":"Example","location_text":"Remote","employment_type":"full-time","salaryRange":{"min":100000,"max":150000,"currency":"USD","interval":"year"},"skills":["Python","ReactJS"]}}]}'
          curl --fail --silent --json "$run_payload" \
            "http://127.0.0.1:3000/api/sources/$source_id/runs" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'SUCCEEDED'; assert data['items_persisted'] == 2"
          curl --fail --silent --json "$run_payload" \
            "http://127.0.0.1:3000/api/sources/$source_id/runs" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['items_skipped'] == 2"
          curl --fail --silent "http://127.0.0.1:3000/api/source-runs?source_id=$source_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 2"
          curl --fail --silent --request POST \
            "http://127.0.0.1:3000/api/opportunities/normalizations/pending?limit=10"
          curl --fail --silent http://127.0.0.1:3000/api/opportunities | \
            python -c "import json,sys; from decimal import Decimal; data=json.load(sys.stdin); assert data['total'] == 1; item=data['items'][0]; assert item['fingerprint_version'] == 'v1'; assert item['work_mode'] == 'REMOTE'; assert item['seniority'] == 'SENIOR'; assert item['contract_type'] == 'FULL_TIME'; assert len(item['compensations']) == 2; assert all(Decimal(value['minimum']) == Decimal('100000') and value['currency'] == 'USD' for value in item['compensations']); assert {skill['canonical_name'] for skill in item['skills']} == {'python', 'react'}; assert all(skill['taxonomy_version'] == 'skills-v1' for skill in item['skills']); assert len(item['occurrences']) == 2"
      - name: Verify deterministic matching through the public API
        run: |
          profile_payload='{"expected_profile_version":0,"skills":[{"canonical_name":"python"},{"canonical_name":"react"}],"preferences":{"work_modes":["REMOTE"],"contracts":["FULL_TIME"],"countries":["BR"],"compensation_min":100000,"compensation_currency":"USD","compensation_period":"YEAR"}}'
          profile_draft="$(curl --fail --silent --json "$profile_payload" http://127.0.0.1:3000/api/profile/versions)"
          profile_id="$(python -c "import json,sys; print(json.load(sys.stdin)['id'])" <<< "$profile_draft")"
          profile_lock="$(python -c "import json,sys; print(json.load(sys.stdin)['profile_lock_version'])" <<< "$profile_draft")"
          profile_published="$(curl --fail --silent --json "{\"expected_profile_version\":$profile_lock}" "http://127.0.0.1:3000/api/profile/versions/$profile_id/publish")"
          profile_lock="$(python -c "import json,sys; print(json.load(sys.stdin)['profile_lock_version'])" <<< "$profile_published")"
          curl --fail --silent --json "{\"expected_profile_version\":$profile_lock}" \
            "http://127.0.0.1:3000/api/profile/versions/$profile_id/activate"
          opportunity_id="$(curl --fail --silent http://127.0.0.1:3000/api/opportunities | python -c "import json,sys; print(json.load(sys.stdin)['items'][0]['id'])")"
          match_payload="{\"opportunity_id\":\"$opportunity_id\"}"
          first_match="$(curl --fail --silent --json "$match_payload" http://127.0.0.1:3000/api/matches/evaluate)"
          first_match_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['rules_version'] == 'matching-v1'; assert data['taxonomy_version'] == 'skills-v1'; assert data['eligibility'] == 'UNKNOWN'; assert data['verdict'] == 'REVIEW_REQUIRED'; assert len(data['input_hash']) == 64; assert len(data['eligibility_details']) == 7; assert len(data['factors']) == 8; print(data['id'])" <<< "$first_match")"
          second_match_id="$(curl --fail --silent --json "$match_payload" http://127.0.0.1:3000/api/matches/evaluate | python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          test "$first_match_id" = "$second_match_id"
          curl --fail --silent "http://127.0.0.1:3000/api/matches?opportunity_id=$opportunity_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 1; assert data['items'][0]['id'] == '$first_match_id'"
          echo "MATCH_ID=$first_match_id" >> "$GITHUB_ENV"
      - name: Verify semantic analysis without overriding the deterministic result
        run: |
          first_analysis="$(curl --fail --silent --request POST "http://127.0.0.1:3000/api/matches/$MATCH_ID/analysis")"
          first_analysis_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'AI_COMPLETED'; assert data['schema_version'] == 'analysis-v1'; assert data['prompt_version'] == 'opportunity_analysis/v1'; assert data['summary']; assert len(data['cache_key']) == 64; print(data['id'])" <<< "$first_analysis")"
          curl --fail --silent --request POST "http://127.0.0.1:3000/api/matches/$MATCH_ID/analysis" | \
            python -c "import json,sys; assert json.load(sys.stdin)['id'] == '$first_analysis_id'"
          curl --fail --silent "http://127.0.0.1:3000/api/matches/$MATCH_ID" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['verdict'] == 'REVIEW_REQUIRED'; assert data['eligibility'] == 'UNKNOWN'; assert len(data['factors']) == 8; assert data['analysis']['id'] == '$first_analysis_id'; assert data['analysis']['status'] == 'AI_COMPLETED'"
          unknown_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            http://127.0.0.1:3000/api/matches/00000000-0000-0000-0000-000000000000/analysis)"
          test "$unknown_status" = "404"
      - name: Verify PostgreSQL persistence after restart
        run: |
          before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT version_num FROM alembic_version')"
          companies_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM company_radar.company')"
          raw_items_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item')"
          opportunities_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity')"
          occurrences_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.source_occurrence')"
          compensations_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_compensation')"
          skills_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_skill')"
          matches_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_assessment')"
          factors_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_factor')"
          analyses_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          docker compose -f compose.yaml -f compose.ci.yaml restart postgres
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
          after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT version_num FROM alembic_version')"
          companies_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM company_radar.company')"
          raw_items_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item')"
          opportunities_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity')"
          occurrences_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.source_occurrence')"
          compensations_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_compensation')"
          skills_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_skill')"
          matches_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_assessment')"
          factors_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_factor')"
          analyses_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          test -n "$before"
          test "$before" = "$after"
          test "$companies_before" = "220"
          test "$companies_before" = "$companies_after"
          test "$raw_items_before" = "2"
          test "$raw_items_before" = "$raw_items_after"
          test "$opportunities_before" = "1"
          test "$opportunities_before" = "$opportunities_after"
          test "$occurrences_before" = "2"
          test "$occurrences_before" = "$occurrences_after"
          test "$compensations_before" = "2"
          test "$compensations_before" = "$compensations_after"
          test "$skills_before" = "2"
          test "$skills_before" = "$skills_after"
          test "$matches_before" = "1"
          test "$matches_before" = "$matches_after"
          test "$factors_before" = "8"
          test "$factors_before" = "$factors_after"
          test "$analyses_before" = "1"
          test "$analyses_before" = "$analyses_after"
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail=300
      - name: Stop application
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans

  publish:
    name: Publish / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [e2e]
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api/Dockerfile
          - image: worker
            dockerfile: docker/worker/Dockerfile
          - image: frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opportunity-radar-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
