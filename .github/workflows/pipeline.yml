name: CI/CD

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish container images after validation
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend / lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Verify the prompt schema artifact matches OUTPUT_SCHEMA
        run: python scripts/export_prompt_schema.py --check

  backend-tests:
    name: Backend / tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://opportunity_radar:ci-password@127.0.0.1:5432/opportunity_radar
      RUN_DATABASE_INTEGRATION: "1"
    services:
      postgres:
        # Always an empty database here, so the official pgvector image is safe to use; the
        # compose job builds the project's alpine image with pgvector, as production does.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: opportunity_radar
          POSTGRES_USER: opportunity_radar
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity_radar -d opportunity_radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Verify migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "$(alembic heads | awk '{print $1}')"
      - name: Run backend tests
        run: pytest -q
      - name: Run the 72-hour soak gate against a controlled clock
        # The cloud provider is not part of this gate: with no Groq reachable, every
        # analysis pass would spend its timeout proving something the e2e job proves.
        env:
          AI_ENABLED: "false"
        run: python scripts/soak_gate.py --json

  frontend:
    name: Frontend / lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate frontend
        run: npm run check

  e2e:
    name: Compose / smoke E2E and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, backend-tests, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - name: Start application
        run: docker compose -f compose.yaml -f compose.ci.yaml up --detach --build api worker frontend
      - name: Verify API, frontend and AI mode against the fake Groq stub
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/
          curl --fail http://127.0.0.1:8000/health | python -c "import json,sys; data=json.load(sys.stdin); assert data['ai']['status'] == 'healthy'"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f compose.yaml -f compose.ci.yaml ps -q worker)")" = "healthy"
      - name: Import and expose the researched company catalog
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml run --rm \
            -v "$PWD/docs/pesquisas:/imports:ro" \
            api python scripts/import_research_catalog.py \
            --input /imports/auditoria-186-empresas.md \
            --input /imports/empresas-adicionais.md
          curl --fail http://127.0.0.1:3000/api/companies | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 220"
          curl --fail http://127.0.0.1:3000/api/sources | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 16; assert {item['source_type'] for item in data['items']} == {'ashby', 'lever', 'greenhouse', 'remotive'}; assert all(not item['enabled'] for item in data['items']); greenhouse=next(item for item in data['items'] if item['source_type'] == 'greenhouse'); assert greenhouse['evidence_status'] == 'ats_identified'; assert greenhouse['configuration']['board_token'] == 'assemblyai'; remotive=next(item for item in data['items'] if item['source_type'] == 'remotive'); assert remotive['evidence_status'] == 'unverified'; assert remotive['rate_limit_policy']['minimum_run_interval_seconds'] == 21600"
      - name: Verify manual acquisition through the public API
        run: |
          source_id="$(curl --fail --silent \
            --json '{"source_type":"manual","name":"CI manual intake","enabled":true,"evidence_status":"confirmed","collector_local_tested":true}' \
            http://127.0.0.1:3000/api/sources | \
            python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          run_payload='{"correlation_id":"compose-e2e","inputs":[{"kind":"URL","value":"https://example.com/jobs/ci-1","metadata":{"title":"Senior Python Engineer","company_name":"Example","location_text":"Remote","employment_type":"full-time","salaryRange":{"min":100000,"max":150000,"currency":"USD","interval":"year"},"skills":["Python","ReactJS"]}},{"kind":"TEXT","value":"Required: Python and ReactJS.","metadata":{"title":"Senior Python Engineer","company_name":"Example","location_text":"Remote","employment_type":"full-time","salaryRange":{"min":100000,"max":150000,"currency":"USD","interval":"year"},"skills":["Python","ReactJS"]}}]}'
          curl --fail --silent --json "$run_payload" \
            "http://127.0.0.1:3000/api/sources/$source_id/runs" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'SUCCEEDED'; assert data['items_persisted'] == 2"
          curl --fail --silent --json "$run_payload" \
            "http://127.0.0.1:3000/api/sources/$source_id/runs" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['items_skipped'] == 2"
          curl --fail --silent "http://127.0.0.1:3000/api/source-runs?source_id=$source_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 2"
          curl --fail --silent --request POST \
            "http://127.0.0.1:3000/api/opportunities/normalizations/pending?limit=10"
          curl --fail --silent http://127.0.0.1:3000/api/opportunities | \
            python -c "import json,sys; from decimal import Decimal; data=json.load(sys.stdin); assert data['total'] == 1; item=data['items'][0]; assert item['fingerprint_version'] == 'v1'; assert item['work_mode'] == 'REMOTE'; assert item['seniority'] == 'SENIOR'; assert item['contract_type'] == 'FULL_TIME'; assert len(item['compensations']) == 2; assert all(Decimal(value['minimum']) == Decimal('100000') and value['currency'] == 'USD' for value in item['compensations']); assert {skill['canonical_name'] for skill in item['skills']} == {'python', 'react'}; assert all(skill['taxonomy_version'] == 'skills-v1' for skill in item['skills']); assert len(item['occurrences']) == 2"
      - name: Verify deterministic matching through the public API
        run: |
          profile_payload='{"expected_profile_version":0,"skills":[{"canonical_name":"python"},{"canonical_name":"react"}],"preferences":{"work_modes":["REMOTE"],"contracts":["FULL_TIME"],"countries":["BR"],"compensation_min":100000,"compensation_currency":"USD","compensation_period":"YEAR"}}'
          profile_draft="$(curl --fail --silent --json "$profile_payload" http://127.0.0.1:3000/api/profile/versions)"
          profile_id="$(python -c "import json,sys; print(json.load(sys.stdin)['id'])" <<< "$profile_draft")"
          profile_lock="$(python -c "import json,sys; print(json.load(sys.stdin)['profile_lock_version'])" <<< "$profile_draft")"
          profile_published="$(curl --fail --silent --json "{\"expected_profile_version\":$profile_lock}" "http://127.0.0.1:3000/api/profile/versions/$profile_id/publish")"
          profile_lock="$(python -c "import json,sys; print(json.load(sys.stdin)['profile_lock_version'])" <<< "$profile_published")"
          curl --fail --silent --json "{\"expected_profile_version\":$profile_lock}" \
            "http://127.0.0.1:3000/api/profile/versions/$profile_id/activate"
          opportunity_id="$(curl --fail --silent http://127.0.0.1:3000/api/opportunities | python -c "import json,sys; print(json.load(sys.stdin)['items'][0]['id'])")"
          match_payload="{\"opportunity_id\":\"$opportunity_id\"}"
          first_match="$(curl --fail --silent --json "$match_payload" http://127.0.0.1:3000/api/matches/evaluate)"
          first_match_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['rules_version'] == 'matching-v1'; assert data['taxonomy_version'] == 'skills-v1'; assert data['eligibility'] == 'UNKNOWN'; assert data['verdict'] == 'REVIEW_REQUIRED'; assert len(data['input_hash']) == 64; assert len(data['eligibility_details']) == 7; assert len(data['factors']) == 8; print(data['id'])" <<< "$first_match")"
          second_match_id="$(curl --fail --silent --json "$match_payload" http://127.0.0.1:3000/api/matches/evaluate | python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          test "$first_match_id" = "$second_match_id"
          curl --fail --silent "http://127.0.0.1:3000/api/matches?opportunity_id=$opportunity_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 1; assert data['items'][0]['id'] == '$first_match_id'"
          echo "MATCH_ID=$first_match_id" >> "$GITHUB_ENV"
      - name: Verify semantic analysis without overriding the deterministic result
        run: |
          # The worker analyses the same assessments, and a live claim answers 409 rather
          # than handing back another holder's stale row. Retrying is the intended reply.
          first_analysis="$(curl --fail --retry 10 --retry-all-errors --retry-delay 3 --silent --request POST "http://127.0.0.1:3000/api/matches/$MATCH_ID/analysis")"
          first_analysis_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'AI_COMPLETED'; assert data['schema_version'] == 'analysis-v1'; assert data['metrics'] is not None and data['metrics']['total_ms'] == 1250 and data['metrics']['output_tokens'] == 120, data.get('metrics'); assert data['prompt_version'] == 'opportunity_analysis/v1'; assert data['summary']; assert len(data['cache_key']) == 64; print(data['id'])" <<< "$first_analysis")"
          curl --fail --retry 10 --retry-all-errors --retry-delay 3 --silent --request POST "http://127.0.0.1:3000/api/matches/$MATCH_ID/analysis" | \
            python -c "import json,sys; assert json.load(sys.stdin)['id'] == '$first_analysis_id'"
          curl --fail --silent "http://127.0.0.1:3000/api/matches/$MATCH_ID" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['verdict'] == 'REVIEW_REQUIRED'; assert data['eligibility'] == 'UNKNOWN'; assert len(data['factors']) == 8; assert data['analysis']['id'] == '$first_analysis_id'; assert data['analysis']['status'] == 'AI_COMPLETED'"
          unknown_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            http://127.0.0.1:3000/api/matches/00000000-0000-0000-0000-000000000000/analysis)"
          test "$unknown_status" = "404"
          curl --fail --silent 'http://127.0.0.1:3000/api/analysis-metrics' |             python -c "import json,sys; data=json.load(sys.stdin); assert [item['window'] for item in data['windows']] == ['24h', '7d']; assert isinstance(data['pending'], int) and data['pending'] >= 0; current=[item for item in data['windows'][0]['models'] if item['model_id'] == data['current_model']]; assert len(current) == 1, data; assert current[0]['total_ms_p50'] == 1250, current; assert current[0]['completed'] >= 1; assert 0 <= current[0]['failure_rate'] <= 1"
          analysis_window_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:3000/api/analysis-metrics?window=90d')"
          test "$analysis_window_status" = "422"
      - name: Verify the dashboard read models
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/overview | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['opportunities_total'] == 1; assert data['assessed_opportunities'] == 1; assert data['verdict_counts']['REVIEW_REQUIRED'] == 1; assert data['analyses_degraded'] == 0; assert data['sources_total'] == 17; assert data['sources_failing'] == 0; assert data['pending_normalizations'] == 0; assert data['applications_active'] == 0; assert data['applications_by_stage'] == {}; assert data['follow_ups_due'] == 0"
          curl --fail --silent 'http://127.0.0.1:3000/api/inbox?order=score' | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 1; assert data['order'] == 'score'; item=data['items'][0]; assert item['verdict'] == 'REVIEW_REQUIRED'; assert item['analysis_status'] == 'AI_COMPLETED'; assert item['company_name'] == 'Example'; assert float(item['score']) >= 0"
          curl --fail --silent 'http://127.0.0.1:3000/api/inbox?only_assessed=true' | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 1"
          curl --fail --silent 'http://127.0.0.1:3000/api/inbox?verdict=HIGH_PRIORITY' | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 0"
          curl --fail --silent 'http://127.0.0.1:3000/api/inbox?minimum_score=99' | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 0"
          curl --fail --silent 'http://127.0.0.1:3000/api/inbox?search=senior%20python' | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 1"
          inbox_opportunity_id="$(curl --fail --silent http://127.0.0.1:3000/api/inbox | python -c "import json,sys; print(json.load(sys.stdin)['items'][0]['opportunity_id'])")"
          curl --fail --silent "http://127.0.0.1:3000/api/opportunities/$inbox_opportunity_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['fingerprint_version'] == 'v1'; assert len(data['occurrences']) == 2; assert len(data['normalization_results']) == 2; assert len(data['compensations']) == 2; assert all(item['payload_retained'] and item['payload_expired_at'] is None for item in data['occurrences'])"
          curl --fail --silent 'http://127.0.0.1:3000/api/source-health' | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 17; assert data['failing'] == 0; ran=[item for item in data['items'] if item['last_run_status'] is not None]; assert len(ran) == 1; assert ran[0]['last_run_status'] == 'SUCCEEDED'; assert ran[0]['last_run_items_seen'] == 2; assert ran[0]['last_run_items_skipped'] == 2; assert ran[0]['last_run_duration_seconds'] >= 0; idle=[item for item in data['items'] if item['last_run_id'] is None]; assert len(idle) == 16; assert all(item['last_run_items_seen'] is None for item in idle)"
          curl --fail --silent 'http://127.0.0.1:3000/api/source-health?only_failing=true' | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 0"
          curl --fail --silent 'http://127.0.0.1:3000/api/source-metrics' | \
            python -c "import json,sys; data=json.load(sys.stdin); assert [item['window'] for item in data['windows']] == ['24h', '7d']; day=data['windows'][0]; assert len(day['sources']) == 17; ran=[item for item in day['sources'] if item['has_runs']]; assert len(ran) == 1, ran; assert ran[0]['runs'] == 2; assert ran[0]['dedupe_rate'] == 0.5; assert ran[0]['error_rate'] == 0.0; assert ran[0]['coverage_state'] == 'SUCCEEDED'; assert ran[0]['seniority']['unknown'] == 0; assert ran[0]['seniority']['counts']['SENIOR'] == 2; assert ran[0]['seniority']['mapping_versions'] == {'seniority-v1': 2}; idle=[item for item in day['sources'] if not item['has_runs']]; assert all(item['error_rate'] is None and item['dedupe_rate'] is None for item in idle); assert {item['coverage_state'] for item in idle} == {'NOT_ENABLED'}"
          metrics_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:3000/api/source-metrics?window=90d')"
          test "$metrics_status" = "422"
          curl --fail --silent http://127.0.0.1:3000/api/profile | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'ACTIVE'; assert {skill['canonical_name'] for skill in data['skills']} == {'python', 'react'}; assert data['preferences']['countries'] == ['BR']"
          company_id="$(curl --fail --silent 'http://127.0.0.1:3000/api/companies?page_size=1' | python -c "import json,sys; print(json.load(sys.stdin)['items'][0]['id'])")"
          curl --fail --silent "http://127.0.0.1:3000/api/companies/$company_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['id'] == '$company_id'; assert isinstance(data['aliases'], list); assert isinstance(data['sources'], list)"
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --silent --output /dev/null http://127.0.0.1:3000/inbox
          curl --fail --silent --output /dev/null "http://127.0.0.1:3000/opportunities/$inbox_opportunity_id"
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/sources
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/profile
          curl --fail --silent --output /dev/null "http://127.0.0.1:3000/companies/$company_id"

          echo "OPPORTUNITY_ID=$inbox_opportunity_id" >> "$GITHUB_ENV"
      - name: Verify the application pipeline through the public API
        run: |
          application="$(curl --fail --silent --json "{\"opportunity_id\":\"$OPPORTUNITY_ID\"}" http://127.0.0.1:3000/api/applications)"
          application_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['current_stage'] == 'INTERESTED'; assert data['status'] == 'ACTIVE'; assert data['version'] == 1; assert len(data['history']) == 1; assert data['history'][0]['from_stage'] is None; print(data['id'])" <<< "$application")"
          duplicate_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --json "{\"opportunity_id\":\"$OPPORTUNITY_ID\"}" http://127.0.0.1:3000/api/applications)"
          test "$duplicate_status" = "409"
          illegal_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --json '{"stage":"OFFER","expected_version":1}' "http://127.0.0.1:3000/api/applications/$application_id/transitions")"
          test "$illegal_status" = "422"
          curl --fail --silent --json '{"stage":"APPLIED","expected_version":1,"reason":"submitted"}' \
            "http://127.0.0.1:3000/api/applications/$application_id/transitions" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['current_stage'] == 'APPLIED'; assert data['version'] == 2; assert data['applied_at'] is not None; assert len(data['history']) == 2"
          curl --fail --silent --request PATCH --json '{"expected_version":2,"next_action":"Enviar follow-up","next_action_at":"2030-01-01T12:00:00Z"}' \
            "http://127.0.0.1:3000/api/applications/$application_id/next-action" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['next_action'] == 'Enviar follow-up'; assert data['version'] == 3"
          curl --fail --silent "http://127.0.0.1:3000/api/inbox?applied=true" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['total'] == 1; item=data['items'][0]; assert item['applied'] is True; assert item['application_stage'] == 'APPLIED'; assert item['application_id'] == '$application_id'"
          curl --fail --silent "http://127.0.0.1:3000/api/inbox?applied=false" | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 0"
          curl --fail --silent http://127.0.0.1:3000/api/overview | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['applications_active'] == 1; assert data['applications_by_stage'] == {'APPLIED': 1}; assert data['follow_ups_due'] == 0; assert data['follow_up_window_days'] == 7"
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/applications
          echo "APPLICATION_ID=$application_id" >> "$GITHUB_ENV"
      - name: Verify structured logs and the doctor
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api \
            python scripts/doctor.py --json | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'ok', data; names={check['name'] for check in data['checks']}; assert {'environment', 'database', 'catalogue', 'prompts', 'worker jobs', 'source incidents'} <= names; catalogue=next(check for check in data['checks'] if check['name'] == 'catalogue'); assert catalogue['facts']['companies'] == 220; jobs=next(check for check in data['checks'] if check['name'] == 'worker jobs'); assert jobs['status'] == 'ok', jobs; assert set(jobs['facts']['healthy']) == {'collect_enabled_sources', 'normalize_opportunities', 'evaluate_pending', 'analyze_pending', 'expire_raw_payloads'}, jobs; incidents=next(check for check in data['checks'] if check['name'] == 'source incidents'); assert incidents['facts']['webhook_configured'] is False"
          correlation_id="ci-$(date +%s)"
          curl --fail --silent --output /dev/null --dump-header /tmp/headers \
            --header "X-Correlation-ID: $correlation_id" http://127.0.0.1:3000/api/overview
          grep -iq "x-correlation-id: $correlation_id" /tmp/headers
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --no-log-prefix api | \
            python -c "import json,sys; lines=[json.loads(line) for line in sys.stdin if line.startswith('{')]; matched=[line for line in lines if line.get('correlation_id') == '$correlation_id']; assert matched, 'no structured log carried the correlation id'; assert any(line.get('path') == '/overview' and line.get('status_code') == 200 for line in matched), matched"
      - name: Verify PostgreSQL persistence after restart
        run: |
          before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT version_num FROM alembic_version')"
          companies_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM company_radar.company')"
          raw_items_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item')"
          payloads_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item_payload WHERE payload IS NOT NULL')"
          opportunities_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity')"
          occurrences_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.source_occurrence')"
          compensations_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_compensation')"
          skills_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_skill')"
          matches_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_assessment')"
          factors_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_factor')"
          analyses_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          applications_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM crm.application_process')"
          history_before="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM crm.stage_history')"
          docker compose -f compose.yaml -f compose.ci.yaml restart postgres
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
          after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT version_num FROM alembic_version')"
          companies_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM company_radar.company')"
          raw_items_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item')"
          payloads_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM acquisition.raw_item_payload WHERE payload IS NOT NULL')"
          opportunities_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity')"
          occurrences_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.source_occurrence')"
          compensations_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_compensation')"
          skills_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM opportunities.opportunity_skill')"
          matches_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_assessment')"
          factors_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM matching.match_factor')"
          analyses_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          applications_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM crm.application_process')"
          history_after="$(docker compose -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc 'SELECT count(*) FROM crm.stage_history')"
          test -n "$before"
          test "$before" = "$after"
          test "$companies_before" = "220"
          test "$companies_before" = "$companies_after"
          test "$raw_items_before" = "2"
          test "$raw_items_before" = "$raw_items_after"
          # Envelope and body are one-to-one, and retention has expired nothing yet.
          test "$payloads_before" = "2"
          test "$payloads_before" = "$payloads_after"
          test "$opportunities_before" = "1"
          test "$opportunities_before" = "$opportunities_after"
          test "$occurrences_before" = "2"
          test "$occurrences_before" = "$occurrences_after"
          test "$compensations_before" = "2"
          test "$compensations_before" = "$compensations_after"
          test "$skills_before" = "2"
          test "$skills_before" = "$skills_after"
          test "$matches_before" = "1"
          test "$matches_before" = "$matches_after"
          test "$factors_before" = "8"
          test "$factors_before" = "$factors_after"
          test "$analyses_before" = "1"
          test "$analyses_before" = "$analyses_after"
          test "$applications_before" = "1"
          test "$applications_before" = "$applications_after"
          test "$history_before" = "2"
          test "$history_before" = "$history_after"
          curl --fail --silent "http://127.0.0.1:3000/api/applications/$APPLICATION_ID" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['current_stage'] == 'APPLIED'; assert data['next_action'] == 'Enviar follow-up'; assert len(data['history']) == 2"
      - name: Verify the backup and restore gate
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api \
            python scripts/backup.py --label ci-e2e
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api \
            python -c "import json,pathlib; manifest=json.loads(pathlib.Path('data/backups/ci-e2e.manifest.json').read_text()); counts=manifest['counts']; assert counts['companies'] == 220, counts; assert counts['opportunities'] == 1, counts; assert counts['applications'] == 1, counts; assert counts['stage_history'] == 2, counts; assert manifest['bytes'] > 0"
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api \
            python scripts/restore_check.py --dump data/backups/ci-e2e.dump
      - name: Verify the autonomous cycle without a terminal
        run: |
          compose="docker compose -f compose.yaml -f compose.ci.yaml"
          api="http://127.0.0.1:3000/api"

          # Wait for a condition the worker reaches on its own. Nothing in this step pokes
          # the cycle: every assertion below must become true because a job ran.
          wait_for() {
            description="$1"; shift
            for _ in $(seq 1 60); do
              if eval "$@" >/dev/null 2>&1; then return 0; fi
              sleep 5
            done
            echo "timed out waiting for: $description" >&2
            $compose logs --no-color --tail=200 worker >&2
            return 1
          }
          count_rows() {
            $compose exec -T postgres psql -U opportunity_radar -d opportunity_radar -tAc "$1" | tr -d '[:space:]'
          }

          # The three preconditions the compose stack deliberately does not bootstrap.
          test -n "$(count_rows 'SELECT version_num FROM alembic_version')"
          curl --fail --silent "$api/profile" | \
            python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ACTIVE'"
          homologated='"enabled":true,"evidence_status":"confirmed","terms_reviewed":true,"collector_local_tested":true,"reviewed_at":"2026-09-01T00:00:00Z"'
          create_source() {
            curl --fail --silent --json "$1" "$api/sources" | \
              python -c "import json,sys; print(json.load(sys.stdin)['id'])"
          }
          scheduled_id="$(create_source "{\"source_type\":\"greenhouse\",\"name\":\"CI scheduled board\",\"schedule\":\"* * * * *\",$homologated,\"configuration\":{\"board_token\":\"radar-ci\",\"company_name\":\"Radar CI\"}}")"
          unscheduled_id="$(create_source "{\"source_type\":\"greenhouse\",\"name\":\"CI unscheduled board\",$homologated,\"configuration\":{\"board_token\":\"radar-ci\",\"company_name\":\"Radar CI\"}}")"
          broken_id="$(create_source "{\"source_type\":\"greenhouse\",\"name\":\"CI missing board\",\"schedule\":\"* * * * *\",$homologated,\"configuration\":{\"board_token\":\"radar-absent\",\"company_name\":\"Radar CI\"}}")"

          # Collection: the enabled, scheduled source runs by the clock, as SCHEDULED.
          wait_for "the scheduled source to collect" \
            "curl --fail --silent '$api/source-runs?source_id=$scheduled_id' | python -c \"import json,sys; data=json.load(sys.stdin); assert any(item['status'] == 'SUCCEEDED' and item['execution_trigger'] == 'SCHEDULED' and item['items_persisted'] >= 1 for item in data['items'])\""
          scheduled_run="$(curl --fail --silent "$api/source-runs?source_id=$scheduled_id" | python -c "import json,sys; data=json.load(sys.stdin); run=next(item for item in data['items'] if item['status'] == 'SUCCEEDED'); assert run['correlation_id']; print(run['correlation_id'])")"

          # One unreachable source does not cost the others their pass.
          wait_for "the unreachable source to fail" \
            "curl --fail --silent '$api/source-runs?source_id=$broken_id' | python -c \"import json,sys; data=json.load(sys.stdin); assert any(item['status'] == 'FAILED' for item in data['items'])\""
          curl --fail --silent "$api/source-runs?source_id=$scheduled_id" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert any(item['status'] == 'SUCCEEDED' for item in data['items'])"

          # A source without a schedule stays idle however long the worker runs.
          curl --fail --silent "$api/source-runs?source_id=$unscheduled_id" | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == 0"

          # Normalisation, scoring and the Inbox, with no terminal command in between.
          wait_for "the collected posting to reach the Inbox with a score" \
            "curl --fail --silent '$api/inbox?search=Senior%20Python%20Engineer' | python -c \"import json,sys; data=json.load(sys.stdin); assert any(item['company_name'] == 'Radar CI' and item['score'] is not None for item in data['items'])\""
          autonomous="$(curl --fail --silent "$api/inbox?search=Senior%20Python%20Engineer" | python -c "import json,sys; data=json.load(sys.stdin); item=next(entry for entry in data['items'] if entry['company_name'] == 'Radar CI'); print(item['opportunity_id'])")"

          # The semantic layer is attached or the degradation is visible. Silence is not an
          # accepted outcome: a missing analysis would read as an analysis that passed.
          wait_for "the semantic layer to resolve" \
            "curl --fail --silent '$api/matches?opportunity_id=$autonomous' | python -c \"import json,sys; data=json.load(sys.stdin); assert data['total'] >= 1; analysis=data['items'][0]['analysis']; assert analysis is not None; assert analysis['status'] in ('AI_COMPLETED', 'AI_FAILED', 'AI_SKIPPED')\""

          # Every round is greppable: the run carries the correlation id its pass logged.
          $compose logs --no-color --no-log-prefix worker | \
            python -c "import json,sys; lines=[json.loads(line) for line in sys.stdin if line.startswith('{')]; assert any(line.get('correlation_id') == '$scheduled_run' for line in lines), 'no worker log carried the run correlation id'"

          # A restart re-reads the same state and must add nothing to it.
          assessments_before="$(count_rows 'SELECT count(*) FROM matching.match_assessment')"
          analyses_before="$(count_rows "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          $compose restart worker
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --silent --output /dev/null http://127.0.0.1:8000/health/ready
          sleep 150
          test "$assessments_before" = "$(count_rows 'SELECT count(*) FROM matching.match_assessment')"
          test "$analyses_before" = "$(count_rows "SELECT count(*) FROM matching.match_analysis WHERE status = 'AI_COMPLETED'")"
          test "0" = "$(count_rows "SELECT count(*) FROM matching.match_analysis_claim")"
      - name: Verify the kill switches reach the worker
        run: |
          compose="docker compose -f compose.yaml -f compose.ci.yaml"
          WORKER_COLLECT_ENABLED=false WORKER_NORMALIZE_ENABLED=false \
            WORKER_MATCH_ENABLED=false WORKER_ANALYZE_ENABLED=false \
            WORKER_RETENTION_ENABLED=false \
            $compose up --detach --force-recreate worker
          # The container reports "Started" before the interpreter has booted. Waiting for
          # the ready file is what makes the startup log readable: the worker touches it
          # after the scheduler is built, which is after the line this step asserts on.
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$($compose ps -q worker)")"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$status" = "healthy"
          $compose logs --no-color --no-log-prefix worker | \
            python -c "import json,sys; lines=[json.loads(line) for line in sys.stdin if line.startswith('{')]; configured=[line for line in lines if line.get('message') == 'worker jobs configured']; assert configured, 'the worker never reported its job configuration'; jobs=configured[-1]['jobs']; assert jobs == {'collect_enabled_sources': False, 'normalize_opportunities': False, 'evaluate_pending': False, 'analyze_pending': False, 'expire_raw_payloads': False}, jobs"
      - name: Verify catalogue curation through the public API
        run: |
          api="http://127.0.0.1:3000/api"
          # A company registered by the interface grows the catalogue by one, and the same
          # name typed again answers with the existing record instead of a second one.
          total_before="$(curl --fail --silent "$api/companies?page_size=1" | python -c "import json,sys; print(json.load(sys.stdin)['total'])")"
          company="$(curl --fail --silent --json '{"name":"CI Curated Company","domain":"https://www.ci-curated.example/careers","priority":"high"}' "$api/companies")"
          company_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['outcome'] == 'created'; assert data['company']['domain'] == 'ci-curated.example'; print(data['company']['id'])" <<< "$company")"
          curl --fail --silent "$api/companies?page_size=1" | \
            python -c "import json,sys; assert json.load(sys.stdin)['total'] == $total_before + 1"
          curl --fail --silent --json '{"name":"ci curated company"}' "$api/companies" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['outcome'] == 'matched'; assert data['company']['id'] == '$company_id'"
          domain_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --json '{"name":"CI Stranger","domain":"ci-curated.example"}' "$api/companies")"
          test "$domain_status" = "409"

          # An ATS registered by hand becomes an inert proposal, once.
          curl --fail --silent --json '{"source_type":"greenhouse","endpoint":"https://boards.greenhouse.io/ci-curated","external_key":"ci-curated","evidence_note":"Registered by the CI curation gate."}' \
            "$api/companies/$company_id/sources" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['version'] == 1; assert len(data['revisions']) == 1"
          proposal="$(curl --fail --silent --request POST "$api/companies/$company_id/detect-source")"
          proposal_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['result'] == 'proposed'; assert data['enabled'] is False; print(data['source_id'])" <<< "$proposal")"
          curl --fail --silent --request POST "$api/companies/$company_id/detect-source" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['result'] == 'already_proposed'; assert data['source_id'] == '$proposal_id'"
          proposed="$(curl --fail --silent "$api/sources/$proposal_id")"
          python -c "import json,sys; data=json.load(sys.stdin); assert data['enabled'] is False; assert data['evidence_status'] == 'ats_identified'" <<< "$proposed"

          # A stale homologation write is a conflict, not a configuration error.
          version="$(python -c "import json,sys; print(json.load(sys.stdin)['version'])" <<< "$proposed")"
          controls="{\"enabled\":false,\"terms_reviewed\":true,\"collector_local_tested\":false,\"expected_version\":$version}"
          curl --fail --silent --request PATCH --json "$controls" "$api/sources/$proposal_id" >/dev/null
          stale_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request PATCH --json "$controls" "$api/sources/$proposal_id")"
          test "$stale_status" = "409"

          # A manual run is normalized item by item, as the intake screen shows it.
          manual_id="$(curl --fail --silent --json '{"source_type":"manual","name":"CI curation intake","enabled":true}' "$api/sources" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          run_id="$(curl --fail --silent --json '{"inputs":[{"kind":"TEXT","value":"Platform Engineer at CI Curated. Remote.","metadata":{"title":"Platform Engineer","company_name":"CI Curated Company"}}]}' "$api/sources/$manual_id/runs" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")"
          curl --fail --silent --request POST "$api/opportunities/normalizations/runs/$run_id" | \
            python -c "import json,sys; items=json.load(sys.stdin)['items']; assert len(items) == 1; assert items[0]['result']['status'] in {'SUCCEEDED', 'REVIEW_REQUIRED', 'FAILED'}"
          curl --fail --silent --output /dev/null "http://127.0.0.1:3000/companies/$company_id"
          # A source created with no terminal reaches confirmed evidence only through a live
          # probe, and then runs once the operator records the rest of the gate.
          probe_source="$(curl --fail --silent --json '{"source_type":"greenhouse","name":"CI probed board","configuration":{"board_token":"radar-ci","company_name":"Radar CI"}}' "$api/sources")"
          probe_source_id="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['evidence_status'] == 'unverified'; print(data['id'])" <<< "$probe_source")"
          probe_version="$(python -c "import json,sys; print(json.load(sys.stdin)['version'])" <<< "$probe_source")"
          probed="$(curl --fail --silent --json "{\"expected_version\":$probe_version}" "$api/sources/$probe_source_id/probe")"
          probed_version="$(python -c "import json,sys; data=json.load(sys.stdin); assert data['probe']['status'] == 'PASSED', data; assert data['probe']['evidence_recorded'] is True; source=data['source']; assert source['evidence_status'] == 'confirmed'; assert source['collector_local_tested'] is True; assert source['terms_reviewed'] is False; assert source['enabled'] is False; print(source['version'])" <<< "$probed")"
          too_soon="$(curl --silent --output /dev/null --write-out '%{http_code}' --json "{\"expected_version\":$probed_version}" "$api/sources/$probe_source_id/probe")"
          test "$too_soon" = "429"
          curl --fail --silent --request PATCH --json "{\"enabled\":true,\"terms_reviewed\":true,\"collector_local_tested\":true,\"reviewed_at\":\"2026-09-23T12:00:00Z\",\"expected_version\":$probed_version}" \
            "$api/sources/$probe_source_id" | \
            python -c "import json,sys; assert json.load(sys.stdin)['enabled'] is True"
          curl --fail --silent --json '{"correlation_id":"ci-probed-board"}' "$api/sources/$probe_source_id/runs" | \
            python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'SUCCEEDED', data; assert data['items_seen'] >= 1"
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail=300
      - name: Stop application
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans

  publish:
    name: Publish / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [e2e]
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api/Dockerfile
          - image: worker
            dockerfile: docker/worker/Dockerfile
          - image: frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opportunity-radar-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
